[package]
name = "tomo-app"
version.workspace = true
edition.workspace = true

[lib]
name = "tomo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tomo-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = "0.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBox", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSUserInterfaceItemIdentification", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
