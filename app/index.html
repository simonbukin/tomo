<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomo</title>
    <style>
      /* The mark below is the first thing that the page paints, on the same spot as the native
         splash (splash.rs). It is inline because a linked stylesheet is one more round trip. */
      html, body { height: 100%; margin: 0; background: #0e0e0e; }
      :root[data-theme="light"], :root[data-theme="light"] body { background: #efeee9; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        color: #ecebe8;
        background: #0e0e0e;
      }
      :root[data-theme="light"] #boot { color: #121212; background: #efeee9; }
      #boot svg { width: 64px; height: 64px; }
    </style>
    <script>
      // The real theme comes from the daemon, which has not answered yet. The scheme the app
      // settled on last time is the only ground that will still be right when it does.
      (function () {
        var scheme = null;
        try {
          scheme = localStorage.getItem("tomo.theme.scheme");
        } catch (e) {
          scheme = null;
        }
        if (scheme !== "light" && scheme !== "dark") {
          scheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="tomo">
        <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 65.03 Q59 88.61 86 57.58" />
        </g>
        <g fill="currentColor">
          <circle cx="23.62" cy="33.99" r="9.19" />
          <circle cx="76.38" cy="33.99" r="9.19" />
        </g>
      </svg>
    </div>
    <script>
      // The native splash covers the webview until this paints; any earlier shows WebKit's
      // white page. Two frames: the first schedules the paint, the second runs after it.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          var internals = window.__TAURI_INTERNALS__;
          if (internals && internals.invoke) internals.invoke("splash_ready");
        });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
