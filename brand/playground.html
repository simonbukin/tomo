<title>tomo face lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap">
<style>
  :root {
    --paper: #fbfaf8;
    --surface: #ffffff;
    --ink: #141414;
    --muted: #8a8780;
    --rule: #e6e2da;
    --accent: #7d4dff;
    --accent-soft: #e4dbff;
    --stage: #ffffff;
    --stage-ink: #141414;
    --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --step: 0.28s;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f0f12;
      --surface: #17171b;
      --ink: #ededef;
      --muted: #8b8894;
      --rule: #26262c;
      --accent: #a684ff;
      --accent-soft: #332a55;
      --stage: #17171b;
      --stage-ink: #ededef;
    }
  }

  :root[data-theme="dark"] {
    --paper: #0f0f12;
    --surface: #17171b;
    --ink: #ededef;
    --muted: #8b8894;
    --rule: #26262c;
    --accent: #a684ff;
    --accent-soft: #332a55;
    --stage: #17171b;
    --stage-ink: #ededef;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding-block: 28px 40px;
    padding-inline: 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 300;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  header { display: flex; flex-direction: column; gap: 4px; }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    text-wrap: balance;
  }

  .sub { margin: 0; color: var(--muted); font-size: 12px; }

  .cols { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }

  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; }

  .stage { padding: 22px; display: flex; flex-direction: column; gap: 18px; }

  .plate {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 2px;
    display: grid;
    place-items: center;
    padding: 18px;
    cursor: pointer;
    transition: background var(--step) ease, color var(--step) ease;
  }

  .plate.inverted { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .plate svg { display: block; color: inherit; max-width: 100%; height: auto; }

  .truth { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }

  .truth figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }

  .truth .ink { color: var(--ink); line-height: 0; }

  .truth figcaption { color: var(--muted); font-size: 10px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .seed-field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 2px; padding: 0 8px; background: var(--surface); flex: 1 1 130px; min-width: 0; }

  .seed-field span { color: var(--muted); font-size: 11px; }

  input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 400;
    padding: 7px 0;
  }

  input[type="text"]:focus { outline: none; }
  .seed-field:focus-within { border-color: var(--accent); }

  button {
    font: inherit;
    font-weight: 400;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 7px 11px;
    cursor: pointer;
    transition: border-color var(--step) ease, color var(--step) ease;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .controls { padding: 22px; display: flex; flex-direction: column; gap: 20px; }

  .group { display: flex; flex-direction: column; gap: 13px; }

  .group > h2 {
    margin: 0;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  .row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 52px; align-items: center; gap: 12px; }

  .row label { color: var(--ink); font-size: 12px; }

  .row output { color: var(--muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

  .row.off output { color: var(--accent); }

  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: grab; }
  input[type="range"]:active { cursor: grabbing; }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--rule) 0 var(--fa), var(--accent-soft) var(--fa) var(--fb), var(--rule) var(--fb) 100%);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--surface);
  }

  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--rule) 0 var(--fa), var(--accent-soft) var(--fa) var(--fb), var(--rule) var(--fb) 100%);
  }

  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--surface);
  }

  .verdict { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }

  .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .verdict.in .pip { background: var(--accent); }

  pre {
    margin: 0;
    padding: 13px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 7px 14px;
    border-radius: 2px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--step) ease;
  }

  .toast.show { opacity: 1; }

  @media (max-width: 720px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>

<div class="wrap">
  <header>
    <h1>tomo face lab</h1>
    <p class="sub">Two eyes and one arc. Drag to change the face, or press the dice.</p>
  </header>

  <div class="cols">
    <section class="panel stage">
      <div class="plate" id="plate" role="button" tabindex="0" aria-label="The face. Press to draw a new one."></div>
      <div class="truth" id="truth"></div>
      <div class="bar">
        <div class="seed-field">
          <span>seed</span>
          <input type="text" id="seed" value="tomo" spellcheck="false" autocomplete="off" aria-label="Seed">
        </div>
        <button type="button" id="dice" class="primary">dice</button>
        <button type="button" id="flip">flip</button>
      </div>
    </section>

    <section class="panel controls">
      <div class="group" id="mouth-group">
        <h2>mouth</h2>
      </div>
      <div class="group" id="eyes-group">
        <h2>eyes</h2>
      </div>

      <div class="verdict" id="verdict"><span class="pip"></span><span id="verdict-text"></span></div>

      <pre id="code"></pre>

      <div class="bar">
        <button type="button" id="copy-params">copy params</button>
        <button type="button" id="copy-svg">copy svg</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const BOX = 100;

  const SLIDERS = [
    { key: "half",    label: "width",  group: "mouth-group", min: 10,   max: 45,  step: 0.5,  lo: 20,   hi: 32 },
    { key: "depth",   label: "depth",  group: "mouth-group", min: 0,    max: 45,  step: 0.5,  lo: 11,   hi: 27 },
    { key: "bend",    label: "bend",   group: "mouth-group", min: -0.6, max: 0.6, step: 0.01, lo: -0.2, hi: 0.2 },
    { key: "lean",    label: "lean",   group: "mouth-group", min: -15,  max: 15,  step: 0.5,  lo: -4,   hi: 4 },
    { key: "stroke",  label: "weight", group: "mouth-group", min: 2,    max: 20,  step: 0.5,  lo: 7.5,  hi: 13 },
    { key: "eyeGap",  label: "gap",    group: "eyes-group",  min: 12,   max: 70,  step: 0.5,  lo: 30,   hi: 46 },
    { key: "eyeR",    label: "size",   group: "eyes-group",  min: 1.5,  max: 14,  step: 0.1,  lo: 4.8,  hi: 7.2 },
    { key: "eyeRise", label: "height", group: "eyes-group",  min: 5,    max: 50,  step: 0.5,  lo: 16,   hi: 30 },
  ];

  const fnv1a = (text) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };

  const mulberry32 = (state) => () => {
    state = (state + 0x6d2b79f5) | 0;
    let t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const fromSeed = (seed) => {
    const next = mulberry32(fnv1a(String(seed)));
    const span = (lo, hi) => lo + next() * (hi - lo);
    return {
      half: span(20, 32),
      depth: span(11, 27),
      bend: span(-0.2, 0.2),
      lean: span(-4, 4),
      stroke: span(7.5, 13),
      eyeGap: span(30, 46),
      eyeR: span(4.8, 7.2),
      eyeRise: span(16, 30),
    };
  };

  const round = (n) => Math.round(n * 100) / 100;

  const quad = (a, c, b, t) => {
    const u = 1 - t;
    return {
      x: u * u * a.x + 2 * u * t * c.x + t * t * b.x,
      y: u * u * a.y + 2 * u * t * c.y + t * t * b.y,
    };
  };

  const geometry = (p) => {
    const start = { x: -p.half, y: -p.lean };
    const end = { x: p.half, y: p.lean };
    const control = { x: p.bend * p.half, y: p.depth * 2 };
    const curve = Array.from({ length: 21 }, (_, i) => quad(start, control, end, i / 20));

    const eyeY = Math.min(start.y, end.y) - p.eyeRise;
    const dots = [
      { cx: -p.eyeGap / 2, cy: eyeY, r: p.eyeR },
      { cx: p.eyeGap / 2, cy: eyeY, r: p.eyeR },
    ];

    const xs = [...curve.map((c) => c.x), ...dots.flatMap((d) => [d.cx - d.r, d.cx + d.r])];
    const ys = [...curve.map((c) => c.y), ...dots.flatMap((d) => [d.cy - d.r, d.cy + d.r])];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    const inset = 8 + p.stroke / 2;
    const room = BOX - inset * 2;
    const scale = Math.min(room / Math.max(maxX - minX, 1), room / Math.max(maxY - minY, 1));
    const shiftX = inset + (room - (maxX - minX) * scale) / 2 - minX * scale;
    const shiftY = inset + (room - (maxY - minY) * scale) / 2 - minY * scale;
    const place = (pt) => ({ x: round(pt.x * scale + shiftX), y: round(pt.y * scale + shiftY) });

    const a = place(start), c = place(control), b = place(end);
    return {
      path: `M${a.x} ${a.y} Q${c.x} ${c.y} ${b.x} ${b.y}`,
      dots: dots.map((d) => ({ cx: round(d.cx * scale + shiftX), cy: round(d.cy * scale + shiftY), r: round(d.r * scale) })),
      stroke: round(p.stroke),
    };
  };

  const svgFor = (p, size) => {
    const g = geometry(p);
    const dots = g.dots.map((d) => `<circle cx="${d.cx}" cy="${d.cy}" r="${d.r}"/>`).join("");
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BOX} ${BOX}" width="${size}" height="${size}" role="img" aria-label="tomo"><g fill="none" stroke="currentColor" stroke-width="${g.stroke}" stroke-linecap="round" stroke-linejoin="round"><path d="${g.path}"/></g><g fill="currentColor">${dots}</g></svg>`;
  };

  const STORE = "tomo-face-lab";
  const plate = document.getElementById("plate");
  const truth = document.getElementById("truth");
  const seedInput = document.getElementById("seed");
  const codeBlock = document.getElementById("code");
  const verdict = document.getElementById("verdict");
  const verdictText = document.getElementById("verdict-text");
  const toast = document.getElementById("toast");

  const inputs = new Map();
  const outputs = new Map();
  const rows = new Map();

  let params = load() ?? fromSeed("tomo");
  let inverted = false;
  let tween = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      return SLIDERS.every((s) => typeof saved[s.key] === "number") ? saved : null;
    } catch { return null; }
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(params)); } catch { /* private window */ }
  }

  for (const spec of SLIDERS) {
    const row = document.createElement("div");
    row.className = "row";

    const label = document.createElement("label");
    label.textContent = spec.label;
    label.htmlFor = `r-${spec.key}`;

    const range = document.createElement("input");
    range.type = "range";
    range.id = `r-${spec.key}`;
    range.min = spec.min;
    range.max = spec.max;
    range.step = spec.step;
    const pct = (v) => `${((v - spec.min) / (spec.max - spec.min)) * 100}%`;
    range.style.setProperty("--fa", pct(spec.lo));
    range.style.setProperty("--fb", pct(spec.hi));

    const out = document.createElement("output");
    out.htmlFor = `r-${spec.key}`;

    range.addEventListener("input", () => {
      stopTween();
      params = { ...params, [spec.key]: Number(range.value) };
      render();
      save();
    });

    row.append(label, range, out);
    document.getElementById(spec.group).append(row);
    inputs.set(spec.key, range);
    outputs.set(spec.key, out);
    rows.set(spec.key, row);
  }

  function render() {
    plate.innerHTML = svgFor(params, 300);

    truth.innerHTML = [64, 32, 24, 16]
      .map((s) => `<figure><div class="ink">${svgFor(params, s)}</div><figcaption>${s}px</figcaption></figure>`)
      .join("");

    let stray = 0;
    for (const spec of SLIDERS) {
      const value = params[spec.key];
      inputs.get(spec.key).value = value;
      outputs.get(spec.key).textContent = spec.step < 0.1 ? value.toFixed(2) : value.toFixed(1);
      const off = value < spec.lo || value > spec.hi;
      rows.get(spec.key).classList.toggle("off", off);
      if (off) stray++;
    }

    verdict.classList.toggle("in", stray === 0);
    verdictText.textContent = stray === 0
      ? "in family — every value sits in the generator range"
      : `${stray} value${stray > 1 ? "s" : ""} outside the generator range`;

    codeBlock.textContent = `{\n${SLIDERS.map((s) => `  ${s.key}: ${params[s.key].toFixed(2)},`).join("\n")}\n}`;
  }

  function stopTween() {
    if (tween) { cancelAnimationFrame(tween); tween = null; }
  }

  function glideTo(target) {
    stopTween();
    const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (calm) { params = target; render(); save(); return; }

    const from = { ...params };
    const started = performance.now();
    const step = (now) => {
      const t = Math.min((now - started) / 420, 1);
      const e = 1 - Math.pow(1 - t, 3);
      params = Object.fromEntries(SLIDERS.map((s) => [s.key, from[s.key] + (target[s.key] - from[s.key]) * e]));
      render();
      if (t < 1) { tween = requestAnimationFrame(step); } else { tween = null; save(); }
    };
    tween = requestAnimationFrame(step);
  }

  function say(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(say.timer);
    say.timer = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  async function copy(text, what) {
    try {
      await navigator.clipboard.writeText(text);
      say(`${what} copied`);
    } catch {
      say("Press Ctrl+C to copy the selected text");
      const range = document.createRange();
      range.selectNodeContents(codeBlock);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  const roll = () => {
    const seed = Math.random().toString(36).slice(2, 8);
    seedInput.value = seed;
    glideTo(fromSeed(seed));
  };

  document.getElementById("dice").addEventListener("click", roll);
  plate.addEventListener("click", roll);
  plate.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); roll(); }
  });

  seedInput.addEventListener("input", () => {
    const seed = seedInput.value.trim();
    if (seed) glideTo(fromSeed(seed));
  });

  document.getElementById("flip").addEventListener("click", () => {
    inverted = !inverted;
    plate.classList.toggle("inverted", inverted);
  });

  document.getElementById("copy-params").addEventListener("click", () => copy(codeBlock.textContent, "params"));
  document.getElementById("copy-svg").addEventListener("click", () => copy(svgFor(params, 128), "svg"));

  render();
</script>
