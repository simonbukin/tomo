<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tomo</title>
    <meta name="description" content="A little workspace for coding agents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23a684ff' stroke-width='12' stroke-linecap='round'%3E%3Cpath d='M14 65 Q59 89 86 58'/%3E%3C/g%3E%3Cg fill='%23a684ff'%3E%3Ccircle cx='23.6' cy='34' r='9.2'/%3E%3Ccircle cx='76.4' cy='34' r='9.2'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #17171c;
        --fg-2: #6f6f7c;
        --dot: #c9c9d4;
        --accent: #7d4dff;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f0f12;
          --fg: #e8e8ee;
          --fg-2: #8a8a97;
          --dot: #36363f;
          --accent: #a684ff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f0f12;
        --fg: #e8e8ee;
        --fg-2: #8a8a97;
        --dot: #36363f;
        --accent: #a684ff;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.75;
      }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      main {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        text-align: center;
      }
      .lockup { width: 154px; height: 44px; color: var(--fg); display: block; margin: 0 auto; }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      p { margin: 22px auto 0; max-width: 44ch; color: var(--fg-2); }
      p.lead { color: var(--fg); margin-top: 26px; }
      a {
        display: inline-block;
        margin-top: 32px;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      a:hover { border-bottom-color: currentColor; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

      @media (max-width: 480px) {
        .lockup { width: 126px; height: 36px; }
      }
    </style>
  </head>
  <body>
    <canvas id="tide" aria-hidden="true"></canvas>
    <main>
      <div>
        <h1>tomo</h1>
        <svg class="lockup" viewBox="0 0 70 20" role="img" aria-label="tomo">
          <g transform="scale(0.2)">
            <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 65.03 Q59 88.61 86 57.58" />
            </g>
            <g fill="currentColor">
              <circle cx="23.62" cy="33.99" r="9.19" />
              <circle cx="76.38" cy="33.99" r="9.19" />
            </g>
          </g>
          <g transform="translate(27 2)">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 3V11A2 2 0 0 0 5.5 13" />
              <path d="M1 6H6" />
              <circle cx="13.5" cy="9.5" r="3.5" />
              <path d="M21 13V8.5A2.5 2.5 0 0 1 26 8.5V13" />
              <path d="M26 8.5A2.5 2.5 0 0 1 31 8.5V13" />
              <circle cx="38.5" cy="9.5" r="3.5" />
            </g>
          </g>
        </svg>
        <p class="lead">A little workspace for coding agents.</p>
        <p>
          Every worktree, terminal, and agent in one place. Don't like how it does something?
          Point your agent at the source.
        </p>
        <a href="https://github.com/simonbukin/tomo">github</a>
      </div>
    </main>

    <script>
      // Rows of dots sliding past one another, a half beat apart. The middle stays calm so the
      // words on top of it keep their contrast.
      (function () {
        var canvas = document.getElementById("tide");
        var g = canvas.getContext("2d");
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var STEP = 26;
        var AMP = 9;
        var rows = [];
        var w = 0;
        var h = 0;
        var dot = "";

        function build() {
          var ratio = window.devicePixelRatio || 1;
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * ratio);
          canvas.height = Math.round(h * ratio);
          g.setTransform(ratio, 0, 0, ratio, 0, 0);
          dot = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim();
          rows = [];
          for (var y = STEP; y < h; y += STEP) {
            rows.push({ y: y, phase: Math.random() * 6.283 });
          }
        }

        function draw(t) {
          g.clearRect(0, 0, w, h);
          g.fillStyle = dot;
          var cx = w / 2;
          var cy = h / 2;
          var hush = Math.min(w, h) * 0.34;
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            for (var x = 0; x < w + STEP; x += STEP) {
              var off = Math.sin(x / 90 + t * 0.9 + row.phase) * AMP;
              var near = Math.hypot((x - cx) / 1.9, row.y - cy) / hush;
              var calm = near < 1 ? 0.22 + near * near * 0.78 : 1;
              g.globalAlpha = (0.38 + (off / AMP + 1) * 0.22) * calm;
              g.beginPath();
              g.arc(x, row.y + off, 1.5, 0, 6.283);
              g.fill();
            }
          }
          g.globalAlpha = 1;
        }

        function tick(now) {
          draw(now / 1000);
          requestAnimationFrame(tick);
        }

        build();
        window.addEventListener("resize", function () {
          build();
          if (reduced) draw(0);
        });
        if (reduced) draw(0);
        else requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
