<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tomo</title>
    <meta name="description" content="somewhere to put your agents. small, local, and yours." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23a684ff' stroke-width='12' stroke-linecap='round'%3E%3Cpath d='M14 65 Q59 89 86 58'/%3E%3C/g%3E%3Cg fill='%23a684ff'%3E%3Ccircle cx='23.6' cy='34' r='9.2'/%3E%3Ccircle cx='76.4' cy='34' r='9.2'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #17171c;
        --fg-2: #5f5f6c;
        --fg-3: #9a9aa6;
        --line: #e4e4ea;
        --dot: #c9c9d4;
        --dot-soft: #f0f0f4;
        --accent: #7d4dff;
        --success: #2a9d5c;
        --waiting: #d98a1a;
        --sans: "Work Sans", system-ui, -apple-system, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f0f12; --fg: #e8e8ee; --fg-2: #9a9aa7; --fg-3: #63636f;
          --line: #232329; --dot: #36363f; --dot-soft: #1a1a20;
          --accent: #a684ff; --success: #45b877; --waiting: #e0a445;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f0f12; --fg: #e8e8ee; --fg-2: #9a9aa7; --fg-3: #63636f;
        --line: #232329; --dot: #36363f; --dot-soft: #1a1a20;
        --accent: #a684ff; --success: #45b877; --waiting: #e0a445;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
      canvas.tide { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      main {
        position: relative; min-height: 100%;
        display: grid; align-content: center; justify-items: center;
        padding-block: 56px; padding-left: 16px; padding-right: 16px;
      }
      .stack { width: 100%; max-width: 1060px; display: grid; justify-items: start; gap: 22px; }

      /* ---------- the line ---------- */
      h1 {
        margin: 0;
        font-size: clamp(20px, 2.7vw, 27px);
        font-weight: 500;
        letter-spacing: -0.012em;
        line-height: 1.35;
        color: var(--fg);
      }
      .face { display: inline-block; width: 0.95em; height: 0.95em; vertical-align: -0.11em; margin-right: 0.42em; color: var(--accent); }
      .face svg { width: 100%; height: 100%; display: block; }
      /* Both spellings share one grid cell, so the hover swaps in place and the line never moves. */
      .mark-wrap { display: inline-grid; vertical-align: baseline; cursor: default; }
      .mark-wrap > span { grid-area: 1 / 1; justify-self: start; transition: opacity 240ms ease-out; }
      .kana { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; opacity: 0; }
      .mark-wrap:hover .roman { opacity: 0; }
      .mark-wrap:hover .kana { opacity: 1; }
      .dash { color: var(--fg-3); padding: 0 0.16em; }

      /* ---------- the render ---------- */
      /* The render wants room to breathe on its own, beyond the stack gap. */
      .render { width: 100%; display: grid; gap: 15px; margin-block: 10px; }
      .screen-btn { width: 100%; padding: 0; border: 0; background: none; cursor: pointer; display: block; border-radius: 11px; }
      .screen-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
      .app {
        width: 100%; aspect-ratio: 16 / 9.4;
        border: 1px solid var(--line); border-radius: 11px; overflow: hidden;
        background: var(--bg); color: var(--fg);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22), 0 1px 2px rgba(0, 0, 0, 0.12);
        display: grid; grid-template-rows: 32px 1fr 26px; text-align: left;
        position: relative;
        transition: background 420ms cubic-bezier(0.2, 0, 0, 1), color 420ms cubic-bezier(0.2, 0, 0, 1),
          transform 460ms cubic-bezier(0.2, 0, 0, 1), filter 420ms ease-out;
      }
      .app-bar { display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--line); }
      .app-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
      .app-bar span { margin-left: 8px; font-size: 11.5px; color: var(--fg-3); }
      .app-body { display: grid; grid-template-columns: 234px 1fr; min-height: 0; transition: grid-template-columns 420ms cubic-bezier(0.2, 0, 0, 1); }
      .app-side { border-right: 1px solid var(--line); min-width: 0; overflow: hidden; position: relative; }
      .app-main { min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
      .app-foot { display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--fg-3); font-family: var(--mono); }
      .app-foot .spacer { margin-left: auto; }
      .app-foot .ok { color: var(--success); }

      .caption {
        margin: 0; font-size: 19px; line-height: 1.4; color: var(--fg);
        min-height: 1.4em; transition: opacity 180ms ease-out;
      }
      .caption { transition: opacity 200ms ease-out; }
      .caption .hint { color: var(--fg-3); font-size: 15px; margin-left: 10px; }

      /* ---------- what you can do to it ---------- */
      .app.comic, .app.comic .tomo-ui, .app.comic .pane pre, .app.comic .app-foot {
        font-family: "Comic Sans MS", "Chalkboard SE", cursive !important;
      }
      .app.bright {
        --bg: #fffdf2; --fg: #1b1a14; --fg-2: #5a5747; --fg-3: #8f8b76;
        --line: #e8e2c8; --dot-soft: #fdf6d8; --accent: #e0359b; --success: #17a34a; --waiting: #e07b00;
        background: var(--bg); color: var(--fg);
      }
      .app.huge .tomo-ui { --fs-0: 19px; --fs-1: 23px; }
      .app.huge .tomo-ui .wt-row { height: 112px; grid-template-rows: 34px 28px 30px; }
      .app.huge .tomo-ui .side-lens { font-size: 16px; }
      .app.huge .pane pre { font-size: 21px; line-height: 1.6; }
      .app.huge .tab { font-size: 17px; padding: 10px 18px; }
      .app.huge .app-foot { font-size: 16px; }
      .app.huge .app-body { grid-template-columns: 330px 1fr; }
      .app.crt {
        --bg: #04170a; --fg: #35e06a; --fg-2: #2aa851; --fg-3: #1c7038;
        --line: #0d3d1d; --dot-soft: #07230e; --accent: #7dff9f; --success: #35e06a; --waiting: #c8e035;
        background: var(--bg); color: var(--fg); text-shadow: 0 0 6px rgba(53, 224, 106, 0.35);
      }
      .app.crt .app-bar i { background: #0d3d1d; }
      .app.crt::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
      }
      @keyframes ease-in-place { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      .swap-in { animation: ease-in-place 380ms cubic-bezier(0.2, 0, 0, 1) both; }
      @media (prefers-reduced-motion: reduce) { .swap-in { animation: none; } }
      /* you miss excel */
      .sheet { height: 100%; display: flex; flex-direction: column; background: #fff; color: #111; font-family: Calibri, "Segoe UI", Arial, sans-serif; }
      .sh-bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid #c9c9c9; font-size: 11px; }
      .sh-cell { border: 1px solid #c9c9c9; padding: 2px 7px; min-width: 46px; background: #fff; }
      .sh-fx { flex: 1; border: 1px solid #c9c9c9; padding: 2px 7px; font-family: var(--mono); color: #1a6b3c; background: #fff; }
      .sh-grid { flex: 1; display: grid; grid-template-columns: 30px repeat(4, 1fr); font-size: 11.5px; overflow: hidden; }
      .sh-grid div { border-right: 1px solid #d8d8d8; border-bottom: 1px solid #d8d8d8; padding: 3px 7px; overflow: hidden; white-space: nowrap; }
      .sh-grid .hd { background: #f1f1f1; color: #555; text-align: center; font-weight: 600; }
      .sh-grid .rn { background: #f1f1f1; color: #555; text-align: center; }
      .sh-grid .on { outline: 2px solid #1a6b3c; outline-offset: -2px; }

      /* keeping it simple i see */
      .app.raw, .app.raw * {
        font-family: "Times New Roman", Times, serif !important;
        background: #fff !important; color: #000 !important;
        border-color: #767676 !important; text-shadow: none !important; box-shadow: none !important;
      }
      .app.raw .tomo-ui .wt-row { display: block; height: auto; padding: 1px 0 1px 18px; border: 0; list-style: disc; }
      .app.raw .tomo-ui .wt-row::before { content: "\2022 "; }
      .app.raw .tomo-ui .state, .app.raw .app-bar i { display: none; }
      .app.raw .tomo-ui .wt-name { font-weight: 400; text-decoration: underline; color: #0000ee !important; }
      .app.raw .side-lens { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 700; }
      .app.raw .tabs { display: block; border: 0; }
      .app.raw .tab { display: inline; padding: 0 8px 0 0; text-decoration: underline; color: #0000ee !important; }
      .app.raw .panes { display: block; background: #fff; }
      .app.raw .pane { display: block; border-bottom: 1px solid #767676; }
      .app.raw .pane pre { font-family: "Courier New", monospace !important; font-size: 12px; }
      .app.raw .app-foot, .app.raw .app-bar { border-color: #767676 !important; }

      /* this guy looks familiar */
      .clip { position: absolute; right: 16px; bottom: 16px; display: flex; align-items: flex-end; gap: 9px; z-index: 5; pointer-events: none; }
      .clip .bubble {
        max-width: 208px; background: #ffffe1; color: #111; border: 1px solid #9a9a72;
        border-radius: 4px; padding: 8px 10px; font-size: 11.5px; line-height: 1.4;
        font-family: "Segoe UI", Tahoma, sans-serif; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
      }
      .clip svg { width: 42px; height: 58px; flex: none; }
      .clip .eye { transform-origin: center; animation: clipblink 4.2s infinite; }
      @keyframes clipblink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

      /* a little more visceral */
      .rain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
      .app.storm { filter: brightness(0.82) saturate(0.8); }
      .app.storm .app-foot::after { content: "heavy conflicts \00b7 clearing by six"; margin-left: auto; color: var(--waiting); }

      .fire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; z-index: 4; }
      .app.tilt { transform: rotate(-2.4deg); }
      .app.flip .app-body { direction: rtl; }
      .app.flip .app-body > * { direction: ltr; }
      .app.flip .app-side { border-right: 0; border-left: 1px solid var(--line); }
      .app.zen .tabs { display: none; }
      .app.zen .panes { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      .app.zen .pane:not(:first-child) { display: none; }
      .app.zen .pane pre { font-size: 15px; line-height: 1.75; }
      .vimline {
        flex: none; display: flex; gap: 14px; padding: 3px 11px;
        background: var(--dot-soft); border-top: 1px solid var(--line);
        font-family: var(--mono); font-size: 10.5px; color: var(--fg-2);
      }
      .vimline b { color: var(--accent); font-weight: 400; }
      .vimline .right { margin-left: auto; }

      /* ---------- tomo's own row CSS, scoped, so the mock carries the app's real metrics ---------- */
      .tomo-ui {
        --bg-1: var(--dot-soft);
        --font-ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, system-ui, sans-serif;
        --fs-0: 11px; --fs-1: 12px; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px;
        font-family: var(--font-ui); font-size: var(--fs-1); padding: var(--sp-1) 0;
      }
      .tomo-ui .side-lens {
        display: flex; align-items: center; gap: var(--sp-2);
        padding: var(--sp-2) var(--sp-3) var(--sp-1);
        font-size: var(--fs-0); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3);
      }
      .tomo-ui .state { width: 7px; height: 7px; border-radius: 50%; background: var(--line); justify-self: center; }
      .tomo-ui .state.work { background: var(--success); }
      .tomo-ui .state.wait { background: var(--waiting); }
      .tomo-ui .wt-meta { color: var(--fg-3); font-size: var(--fs-0); font-family: var(--mono); }
      .tomo-ui .wt-row {
        transition: height 420ms cubic-bezier(0.2, 0, 0, 1);
        display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; grid-template-rows: 18px 15px 16px;
        align-items: center; column-gap: var(--sp-2); height: 58px;
        padding: 4px var(--sp-1) 4px var(--sp-3); border-left: 2px solid transparent;
      }
      .tomo-ui .wt-active { background: var(--bg-1); border-left-color: var(--accent); }
      .tomo-ui .wt-name-line { display: inline-flex; align-items: center; min-width: 0; line-height: 18px; }
      .tomo-ui .wt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-weight: 500; }
      .tomo-ui .wt-active .wt-name { color: var(--accent); }
      .tomo-ui .wt-sub { grid-column: 2 / 4; display: flex; align-items: center; min-width: 0; line-height: 15px; }
      .tomo-ui .wt-branch { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: var(--fs-0); color: var(--fg-2); }
      .tomo-ui .wt-foot { grid-column: 2 / 4; display: flex; align-items: center; gap: var(--sp-2); min-width: 0; line-height: 16px; }
      .tomo-ui .wt-agents { display: inline-flex; align-items: center; gap: var(--sp-1); flex: none; color: var(--fg-2); font-size: var(--fs-0); }

      /* ---------- the main area ---------- */
      .tabs { display: flex; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); flex: none; }
      .tab { background: var(--bg); padding: 6px 13px; font-size: 11px; color: var(--fg-3); font-family: var(--mono); }
      .tab.on { color: var(--fg); }
      .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; transition: grid-template-columns 420ms cubic-bezier(0.2, 0, 0, 1), grid-template-rows 420ms cubic-bezier(0.2, 0, 0, 1); }
      .panes.nine { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
      .pane { background: var(--bg); padding: 9px 11px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
      .pane pre { margin: 0; font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--fg-2); white-space: pre-wrap; word-break: break-all; }
      .panes.nine .pane pre { font-size: 9px; line-height: 1.6; }
      .pane pre::after {
        content: ""; display: inline-block; width: 5px; height: 9px; margin-left: 2px;
        vertical-align: -1px; background: var(--accent); animation: blink 1.05s steps(1, end) infinite;
      }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

      .tank { display: block; width: 100%; height: 100%; }

      .board { height: 100%; background: #0b0b0d; padding: 11px 12px; font-family: var(--mono); }
      .bd-head { display: grid; grid-template-columns: 44px 1fr; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6a6a58; padding-bottom: 7px; }
      .bd-row { display: grid; grid-template-columns: 44px 1fr; align-items: baseline; font-size: 11.5px; color: #f5c518; padding: 7px 0; border-top: 1px solid #1d1d16; }
      .bd-row b { display: block; font-weight: 400; font-size: 9.5px; letter-spacing: 0.05em; color: #b99512; padding-top: 2px; }
      .bd-row b span { display: inline-block; transition: transform 90ms ease-out; }
      .bd-row b span.turn { transform: rotateX(72deg); }
      .train {
        position: absolute; left: 0; bottom: 8px; white-space: nowrap;
        font-size: 19px; line-height: 1; pointer-events: none;
        filter: drop-shadow(0 0 7px rgba(245, 197, 24, 0.35));
      }

      .label { height: 100%; padding: 16px 20px; font-family: Helvetica, Arial, sans-serif; color: var(--fg); overflow: hidden; }
      .lb-title { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
      .lb-serv { font-size: 12px; padding-top: 2px; }
      .rule { height: 1px; background: var(--fg); margin: 6px 0; }
      .rule.thick { height: 8px; }
      .lb-amt { font-size: 10.5px; font-weight: 700; }
      .lb-big { display: flex; justify-content: space-between; font-size: 19px; font-weight: 800; }
      .lb-dv { font-size: 10px; font-weight: 700; text-align: right; padding-bottom: 2px; }
      .lb-line { display: grid; grid-template-columns: 1fr auto 52px; gap: 10px; font-size: 12.5px; padding: 3px 0; border-top: 1px solid var(--line); }
      .lb-line b { font-weight: 700; }
      .lb-line i { font-style: normal; font-weight: 700; text-align: right; }
      .lb-foot { font-size: 10px; color: var(--fg-2); padding-top: 5px; }

      .overlay { position: absolute; right: 13px; bottom: 13px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; pointer-events: none; }
      .jab {
        margin: 0; font-size: 12px; line-height: 1.4; color: var(--fg);
        background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
        padding: 7px 11px; max-width: 250px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
        opacity: 0; transform: translateY(7px);
        transition: opacity 320ms ease-out, transform 320ms cubic-bezier(0.2, 0, 0, 1);
      }
      .jab.in { opacity: 1; transform: none; }
      .jab.noise { font-family: var(--mono); font-size: 11px; }

      /* ---------- get it ---------- */
      .get { margin: 0; font-size: 17px; color: var(--fg-2); }
      .get a, .linkish {
        color: var(--fg); background: none; border: 0; padding: 0;
        font: inherit; cursor: pointer; text-decoration: none;
        border-bottom: 1px solid var(--fg-3);
      }
      .get a:hover, .linkish:hover { color: var(--accent); border-bottom-color: currentColor; }
      .get a:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
      /* Both sentences share one grid cell, so the line never jumps and nothing is rebuilt. */
      .get { display: grid; }
      .get > span { grid-area: 1 / 1; transition: opacity 200ms ease-out; }
      .get .taken { color: var(--fg); opacity: 0; pointer-events: none; }
      .get[data-taken] .offer { opacity: 0; pointer-events: none; }
      .get[data-taken] .taken { opacity: 1; }
      .copy-wrap { position: relative; display: inline-block; }
      .tip {
        position: absolute; bottom: calc(100% + 9px); left: 0;
        font-family: var(--mono); font-size: 12px; line-height: 1.5;
        color: var(--fg-2); background: var(--bg); border: 1px solid var(--line);
        border-radius: 5px; padding: 7px 10px; white-space: nowrap;
        pointer-events: none; opacity: 0; transform: translateY(3px);
        transition: opacity 140ms ease-out, transform 140ms ease-out;
      }
      .tip::before { content: "$ "; color: var(--fg-3); }
      .copy-wrap:hover .tip, .linkish:focus-visible + .tip { opacity: 1; transform: none; }

      .foot { margin: 0; color: var(--fg-3); font-size: 13.5px; }
      .foot a { color: var(--fg-2); text-decoration: none; border-bottom: 1px solid var(--line); }
      .foot a:hover { color: var(--fg); border-bottom-color: currentColor; }
      a { color: inherit; }
      a:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) {
        .mark-wrap > span, .tip, .caption, .jab, .pane pre::after, .app { transition: none; animation: none; }
      }
      @media (max-width: 760px) {
        .app-body { grid-template-columns: 162px 1fr; }
        .app { aspect-ratio: 4 / 3.4; }
        .tomo-ui .wt-row { height: 52px; }
        h1 { font-size: 18px; }
        .tip { white-space: normal; max-width: calc(100vw - 48px); }
      }
    </style>
  </head>
  <body>
    <canvas class="tide" id="tide" aria-hidden="true"></canvas>
    <main>
      <div class="stack">
        <h1>
          <span class="face" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 65.03 Q59 88.61 86 57.58" />
              </g>
              <g fill="currentColor">
                <circle cx="23.62" cy="33.99" r="9.19" />
                <circle cx="76.38" cy="33.99" r="9.19" />
              </g>
            </svg>
          </span><span class="mark-wrap"><span class="roman">tomo</span><span class="kana" aria-hidden="true">とも</span></span><span class="dash">-</span>somewhere to put your agents
        </h1>

        <div class="render">
          <p class="caption" id="caption"></p>
          <button type="button" class="screen-btn" id="screen" aria-label="tomo. Click it to change something.">
            <div class="app" id="app">
              <div class="app-bar"><i></i><i></i><i></i><span>tomo</span></div>
              <div class="app-body">
                <div class="app-side" id="side"></div>

        function terminals(count) {

        var audio = null;
        function beep(notes, kind) {
          if (reduced) return;
          try {
            if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === "suspended") audio.resume();
          } catch (err) {
            return;
          }
          notes.forEach(function (hz, n) {
            var at = audio.currentTime + n * 0.085;
            var osc = audio.createOscillator();
            var gain = audio.createGain();
            osc.type = kind || "triangle";
            osc.frequency.setValueAtTime(hz, at);
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.exponentialRampToValueAtTime(0.06, at + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);
            osc.connect(gain).connect(audio.destination);
            osc.start(at);
            osc.stop(at + 0.26);
          });
        }

        function toaster(box, lines, gap, extraClass, sounds) {
          var at = 0, hold = 0;
          var push = function () {

        // Each demand knows how to apply itself, and what the app says about it.

          {

              ];
              var frame = 0;
              var paint = function () {
                var w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
                if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                g.clearRect(0, 0, w, h);
                var css = getComputedStyle(app);
                fish.forEach(function (f, n) {

                  g.fillStyle = css.getPropertyValue("--accent").trim();
                  g.beginPath();
                  g.ellipse(0, 0, size, size * 0.62, 0, 0, 6.283);
                  g.fill();
                  g.beginPath();
                  g.moveTo(-size, 0);
                  g.lineTo(-size * 1.75, -size * 0.55);
                  g.lineTo(-size * 1.75, size * 0.55);
                  g.closePath();
                  g.fill();
                  g.restore();
                  g.globalAlpha = 0.7;
                  g.fillStyle = css.getPropertyValue("--fg-2").trim();
                  g.font = "10px " + css.getPropertyValue("--mono");
                  g.textAlign = "center";
                  g.fillText(f.name + (f.dead ? " (rip)" : ""), px, py + size * 2);

              paint();
              return reduced ? null : function () { frame += 1; paint(); };
            },
          },
          {
            id: "trains",
            says: "trains. you want them to be trains.",
            apply: function () {
              side.innerHTML =
                '<div class="board"><div class="bd-head"><span>time</span><span>worktree</span></div>' +
                [["09:42", "thistle", "ON TIME"], ["09:51", "juniper", "DELAYED"], ["10:03", "mallow", "BOARDING"], ["10:20", "kestrel", "CANCELLED"]]
                  .map(function (d) { return '<div class="bd-row"><span>' + d[0] + '</span><span>' + d[1] + '<b class="flap"></b></span></div>'; })
                  .join("") +
                '<div class="train">\ud83d\ude82\ud83d\ude83\ud83d\ude83\ud83d\ude83</div></div>';

              var flaps = Array.prototype.slice.call(side.querySelectorAll(".flap"));
              var train = side.querySelector(".train");
              var options = ["ON TIME", "DELAYED", "BOARDING", "CANCELLED", "REPLACED BY BUS", "ON TIME*", "SEE STAFF"];
              var GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
              var seeds = ["ON TIME", "DELAYED", "BOARDING", "CANCELLED"];

              // Every cell is its own flap, so a row rolls letter by letter instead of all at once.
              var cells = flaps.map(function (el, n) {
                var target = seeds[n];
                el.innerHTML = target.split("").map(function (ch) { return "<span>" + ch + "</span>"; }).join("");
                return { el: el, spans: Array.prototype.slice.call(el.children), target: target, at: 99, hold: 20 + n * 25 };
              });

              var frame = 0;
              return reduced ? null : function () {
                frame += 1;
                train.style.transform = "translateX(" + (-90 + ((frame * 1.5) % 340)) + "%)";

                cells.forEach(function (cell) {
                  if (cell.at < cell.target.length) {
                    // three frames a letter: tip over, change, tip back
                    var step = cell.step || 0;
                    var span = cell.spans[cell.at];
                    if (step === 0 && span) span.classList.add("turn");
                    if (step === 1 && span) span.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
                    if (step === 2 && span) { span.textContent = cell.target[cell.at]; span.classList.remove("turn"); }
                    cell.step = step + 1;
                    if (cell.step > 2) { cell.step = 0; cell.at += 1; }
                    return;
                  }
                  cell.hold -= 1;
                  if (cell.hold > 0) return;
                  var next = options[Math.floor(Math.random() * options.length)];
                  cell.target = next;
                  cell.el.innerHTML = next.split("").map(function (ch) { return "<span>" + ch + "</span>"; }).join("");
                  cell.spans = Array.prototype.slice.call(cell.el.children);
                  cell.at = 0;
                  cell.step = 0;
                  cell.hold = 90 + Math.floor(Math.random() * 90);
                });
              };
            },
          },
          {
            id: "nine",

          {

              var tok = mainArea.querySelector(".tok");

          { id: "crt", says: "ooo, how retro of you.", css: "crt" },
          { id: "tilt", says: "this is not good for your neck btw.", css: "tilt" },
          { id: "flip", says: "i guess you can put it over there.", css: "flip" },
          { id: "zen", says: "just the one, then.", css: "zen" },
          {
            id: "animals",
            says: "sure, i guess the agents can be little guys.",
            apply: function () {
              side.innerHTML = sidebar([
                ["\ud83e\udda6 otter", "feat/pricing-rewrite", "claude \u00b7 2 panes", "active", "12m"],
                ["\ud83e\uddab beaver", "feat/checkout-copy", "codex \u00b7 waiting on you", "wait", "2h"],
                ["\ud83e\udda2 crane", "feat/search-index", "claude", "work", "3h"],
                ["\ud83e\uddad seal", "chore/drop-old-flag", "", "", "1d"],
              ]);
              return null;
            },
          },
          {
            id: "money",
            says: "racks on racks.",
            apply: function () {
              side.innerHTML = sidebar([
                ["thistle", "feat/pricing-rewrite", "$18.60 \u00b7 2.4M tokens", "active", "12m"],
                ["juniper", "feat/checkout-copy", "$8.30 \u00b7 1.1M tokens", "wait", "2h"],
                ["mallow", "feat/search-index", "$6.10 \u00b7 840k tokens", "work", "3h"],

          },
          {
            id: "vim",
            says: "vim keys. obviously.",
            apply: function () {
              var bar = document.createElement("div");
              bar.className = "vimline";
              bar.innerHTML = '<b>-- NORMAL --</b><span>pricing.ts</span><span class="right">42,7   34%</span>';
              mainArea.appendChild(bar);
              var modes = ["-- NORMAL --", "-- INSERT --", "-- VISUAL --", ":w"];
              var at = 0, hold = 0;

          },
          {
            id: "sheet",

            apply: function () {

                ["thistle", "feat/pricing-rewrite", "claude", "18.60"],

              var cells = '<div class="sh-grid"><div class="hd"></div>' +

                '<div class="rn">1</div>' + COLS.map(function (c) { return "<div><b>" + c + "</b></div>"; }).join("") +
                ROWS.map(function (r, n) {

                }).join("") +
                '<div class="rn">6</div><div>total</div><div></div><div></div><div class="sum">33.72</div></div>';
              mainArea.innerHTML =
                '<div class="sheet"><div class="sh-bar"><span class="sh-cell">D6</span>' +
                '<span class="sh-fx">=SUM(D2:D5)</span></div>' + cells + "</div>";

              var grid = mainArea.querySelector(".sh-grid");
              var boxes = Array.prototype.slice.call(grid.children).filter(function (el) {

              var sum = mainArea.querySelector(".sum");
              var at = 0, hold = 0, total = 33.72;
              return reduced ? null : function () {
                hold += 1;

                boxes.forEach(function (el) { el.classList.remove("on"); });
                at = (at + 1) % boxes.length;
                boxes[at].classList.add("on");

                sum.textContent = total.toFixed(2);
              };
            },
          },
          { id: "raw", says: "keeping it simple i see.", css: "raw" },
          {
            id: "clippy",
            says: "this guy looks familiar.",
            apply: function () {
              var lines = [
                "It looks like you're running nine agents. Would you like help?",
                "I see you have not merged since Tuesday.",
                "Would you like me to write a commit message? I will not be good at it.",
                "It looks like you're on fire.",
              ];
              var box = document.createElement("div");
              box.className = "clip";
              box.innerHTML =
                '<div class="bubble">' + lines[0] + "</div>" +
                '<svg viewBox="0 0 40 56" fill="none" stroke="#8a8a96" stroke-width="3.4" stroke-linecap="round">' +
                '<path d="M12 50 V14 a8 8 0 0 1 16 0 v30 a5 5 0 0 1-10 0 V18" />' +
                '<circle class="eye" cx="15" cy="17" r="2.6" fill="#1b1b22" stroke="none" />' +
                '<circle class="eye" cx="25" cy="17" r="2.6" fill="#1b1b22" stroke="none" />' +
                "</svg>";
              app.appendChild(box);
              var bubble = box.querySelector(".bubble");
              var at = 0, hold = 0;
              return reduced ? null : function () {
                hold += 1;
                if (hold < 82) return;
                hold = 0;
                at += 1;
                bubble.textContent = lines[at % lines.length];
              };
            },
          },
          {
            id: "storm",
            says: "a little more visceral, sure.",
            css: "storm",
            apply: function () {
              var canvas = document.createElement("canvas");
              canvas.className = "rain";
              app.appendChild(canvas);
              var g = canvas.getContext("2d");
              var drops = [];
              var flash = 0;
              for (var i = 0; i < 150; i++) {
                drops.push({ x: Math.random(), y: Math.random(), len: 9 + Math.random() * 20, v: 0.012 + Math.random() * 0.016 });
              }
              var paint = function () {
                var w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
                if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                g.clearRect(0, 0, w, h);
                if (flash > 0) {
                  g.fillStyle = "rgba(255,255,255," + (flash * 0.16).toFixed(3) + ")";
                  g.fillRect(0, 0, w, h);
                  flash -= 0.08;
                }
                g.strokeStyle = "rgba(150,180,220,0.42)";

                g.beginPath();
                drops.forEach(function (d) {
                  if (!reduced) { d.y += d.v; d.x += d.v * 0.22; }
                  if (d.y > 1.05) { d.y = -0.08; d.x = Math.random(); }
                  if (d.x > 1.05) d.x = -0.05;
                  var px = d.x * w, py = d.y * h;
                  g.moveTo(px, py);
                  g.lineTo(px - d.len * 0.24, py - d.len);

          {

            says: "and now it's on fire. cool. cool cool cool.",
            apply: function () {
              var canvas = document.createElement("canvas");
              canvas.className = "fire";
              app.appendChild(canvas);
              var g = canvas.getContext("2d", { willReadFrequently: true });
              // The demoscene fire: seed the bottom row hot, cool and drift upward, then scale
              // a small buffer over the whole window so it stays cheap at any size.
              var W = 132, H = 78;
              var heat = new Uint8Array(W * H);
              var palette = [];
              for (var i = 0; i < 256; i++) {
                var t = i / 255;
                palette.push([
                  Math.min(255, Math.round(Math.pow(t, 0.55) * 400)),
                  Math.round(Math.pow(t, 1.9) * 255),
                  Math.round(Math.pow(t, 5) * 210),
                  Math.min(255, Math.round(Math.pow(t, 0.7) * 320)),
                ]);
              }
              var image = g.createImageData(W, H);
              var buffer = document.createElement("canvas");
              buffer.width = W;
              buffer.height = H;
              var bg = buffer.getContext("2d");

              var burn = function () {
                for (var x = 0; x < W; x++) heat[(H - 1) * W + x] = Math.random() < 0.82 ? 255 : 90;
                for (var y = 0; y < H - 1; y++) {
                  for (var x2 = 0; x2 < W; x2++) {
                    var below = (y + 1) * W + ((x2 + (Math.random() * 3 | 0) - 1 + W) % W);
                    var next = heat[below] - (Math.random() * 15 | 0);
                    heat[y * W + x2] = next < 0 ? 0 : next;
                  }
                }
                for (var p = 0; p < heat.length; p++) {
                  var c = palette[heat[p]];
                  image.data[p * 4] = c[0];
                  image.data[p * 4 + 1] = c[1];
                  image.data[p * 4 + 2] = c[2];
                  image.data[p * 4 + 3] = c[3];
                }
                bg.putImageData(image, 0, 0);
                var w = canvas.clientWidth, h = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
                if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }

                g.clearRect(0, 0, w, h);
                g.imageSmoothingEnabled = true;
                g.globalAlpha = 0.9;
                g.drawImage(buffer, 0, 0, w, h);
                g.globalAlpha = 1;
              };

        var left = [];
        var runners = [];

        function reshuffle() {
          left = DEMANDS.slice();
          for (var i = left.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var held = left[i];
            left[i] = left[j];
            left[j] = held;
          }
        }

        function collectTyping() {
          typing = Array.prototype.slice.call(mainArea.querySelectorAll("pre[data-script]")).map(function (el, k) {
            return { el: el, script: SCRIPTS[(+el.dataset.script + k * 3) % SCRIPTS.length], done: [], line: 0, char: 0, hold: k * 6 };
          });
          if (reduced) typing.forEach(function (t) { t.el.textContent = t.script.join("\n"); });
        }

        function stock() {
          app.className = "app";
          side.innerHTML = sidebar();
          mainArea.innerHTML = terminals(4);
          runners = [];
          collectTyping();
          reshuffle();
        }

        function grant() {
          if (!left.length) {
            stock();
            caption.textContent = "fine. put it back.";
            return;
          }
          var demand = left.pop();
          if (demand.css) app.classList.add(demand.css);
          if (demand.apply) {
            var run = demand.apply();
            if (run) runners.push(run);
            collectTyping();
          }
          // Only what actually changed eases in; the window never blanks.
          [side, mainArea].forEach(function (region) {
            Array.prototype.forEach.call(region.children, function (child) {
              if (child.dataset.settled) return;
              child.dataset.settled = "";
              child.classList.add("swap-in");
            });
          });
          caption.textContent = demand.says;
        }

        document.getElementById("screen").addEventListener("click", grant);

        stock();
        caption.innerHTML = 'this is tomo, before you mess it up.<span class="hint">click it</span>';
        window.setInterval(function () {
          if (!reduced) {
            typing.forEach(function (t) {
              if (t.hold > 0) { t.hold -= 1; return; }
              var current = t.script[t.line % t.script.length];
              t.char += 1;
              t.el.textContent = t.done.concat([current.slice(0, t.char)]).join("\n");
              if (t.char < current.length) return;
              t.done.push(current);
              while (t.done.length > 5) t.done.shift();
              t.line += 1;
              t.char = 0;
              t.hold = t.line % t.script.length === 0 ? 36 : 7;
            });
          }
          runners.forEach(function (run) { run(); });
        }, 55);
      })();

      // ---------- take it ----------
      (function () {
        var button = document.getElementById("copy");
        var sentence = document.getElementById("get");
        var taken = sentence.querySelector(".taken");
        var command = document.getElementById("copyTip").textContent;
        var timer = 0;

        button.setAttribute("aria-label", "Copy the install command: " + command);
        button.addEventListener("click", function () {
          var settle = function (words) {
            taken.textContent = words;
            sentence.setAttribute("data-taken", "");
            window.clearTimeout(timer);
            timer = window.setTimeout(function () { sentence.removeAttribute("data-taken"); }, 4600);
          };
          // No clipboard on an insecure origin, and the promise rejects on a denied permission.
          if (!navigator.clipboard) return settle("copy it yourself, it's in the tooltip.");
          navigator.clipboard.writeText(command).then(
            function () { settle("it's yours now. i hope you can handle the responsibility."); },
            function () { settle("copy it yourself, it's in the tooltip."); },
          );
        });
      })();

      // ---------- the tide ----------
      (function () {
        var canvas = document.getElementById("tide");
        var g = canvas.getContext("2d");
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var STEP = 26, AMP = 9;
        var rows = [], rings = [];
        var w = 0, h = 0, dpr = 1, dot = "";

        function build() {
          dpr = window.devicePixelRatio || 1;
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          dot = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim();
          rows = [];
          for (var y = STEP; y < h; y += STEP) rows.push({ y: y, phase: Math.random() * 6.283 });
        }

        function draw(t) {
          g.clearRect(0, 0, w, h);
          g.fillStyle = dot;
          var box = document.querySelector(".stack").getBoundingClientRect();
          var cx = box.left + box.width / 2;
          var cy = box.top + box.height / 2;
          var hush = Math.max(box.width, box.height) * 0.6;
          for (var i = 0; i < rows.length; i++) {
            var line = rows[i];
            for (var x = 0; x < w + STEP; x += STEP) {
              var off = Math.sin(x / 90 + t * 0.9 + line.phase) * AMP;
              for (var k = 0; k < rings.length; k++) {
                var ring = rings[k];
                var age = t - ring.t;
                var edge = Math.hypot(x - ring.x, line.y - ring.y) - age * 420;
                if (Math.abs(edge) < 150) off += Math.cos(edge / 48) * 13 * Math.max(0, 1 - age / 1.5);
              }
              var near = Math.hypot(x - cx, (line.y - cy) * 1.4) / hush;
              var calm = near < 1 ? 0.16 + near * near * 0.84 : 1;
              g.globalAlpha = (0.38 + (off / AMP + 1) * 0.22) * calm;
              // Snapped to the device pixel grid: a 1.5px circle on a fractional centre is mush.
              g.beginPath();
              g.arc(Math.round(x * dpr) / dpr, Math.round((line.y + off) * dpr) / dpr, 1.5, 0, 6.283);
              g.fill();
            }
          }
          g.globalAlpha = 1;
        }

        function loop(now) {
          var t = now / 1000;
          rings = rings.filter(function (ring) { return t - ring.t < 1.5; });
          draw(t);
          requestAnimationFrame(loop);
        }

        build();
        window.addEventListener("resize", function () { build(); if (reduced) draw(0); });
        if (!reduced) {
          document.addEventListener("pointerdown", function (event) {
            if (event.target.closest("a, button")) return;
            rings.push({ x: event.clientX, y: event.clientY, t: performance.now() / 1000 });
          });
        }
        if (reduced) draw(0);
        else requestAnimationFrame(loop);
      })();

      console.log(
        "%cとも%c  you found the console. the whole thing is one html file — read it, take it.",
        "font-size:15px",
        "font-size:12px;color:#8a8a97",
      );
    </script>
  </body>
</html>
