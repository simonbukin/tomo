<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tomo</title>
    <meta name="description" content="A little workspace for coding agents." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23a684ff' stroke-width='12' stroke-linecap='round'%3E%3Cpath d='M14 65 Q59 89 86 58'/%3E%3C/g%3E%3Cg fill='%23a684ff'%3E%3Ccircle cx='23.6' cy='34' r='9.2'/%3E%3Ccircle cx='76.4' cy='34' r='9.2'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #17171c;
        --fg-2: #7a7a86;
        --dot: #d4d4dc;
        --accent: #7d4dff;
        --working: #2a9d5c;
        --waiting: #d98a1a;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f0f12;
          --fg: #e8e8ee;
          --fg-2: #7f7f8c;
          --dot: #26262e;
          --accent: #a684ff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f0f12;
        --fg: #e8e8ee;
        --fg-2: #7f7f8c;
        --dot: #26262e;
        --accent: #a684ff;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.7;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      main {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        text-align: center;
      }
      .mark { width: 44px; height: 44px; color: var(--accent); }
      h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; margin: 20px 0 0; }
      p { margin: 4px 0 0; color: var(--fg-2); }
      .says { margin-top: 26px; max-width: 42ch; }
      a {
        display: inline-block;
        margin-top: 30px;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      a:hover { border-bottom-color: currentColor; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <main>
      <div>
        <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="tomo">
          <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 65.03 Q59 88.61 86 57.58" />
          </g>
          <g fill="currentColor">
            <circle cx="23.62" cy="33.99" r="9.19" />
            <circle cx="76.38" cy="33.99" r="9.19" />
          </g>
        </svg>
        <h1>tomo</h1>
        <p>A little workspace for coding agents.</p>
        <p class="says">
          Run a dozen of them across a dozen worktrees. Tomo keeps track of which one works,
          which one waits for you, and which one eats your machine.
        </p>
        <a href="https://github.com/simonbukin/tomo">github</a>
      </div>
    </main>

    <script>
      // A lattice of quiet dots. Now and then one takes an agent state and lets it go again,
      // which is the only thing the app itself animates.
      (function () {
        var canvas = document.getElementById("field");
        var ctx = canvas.getContext("2d");
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var STEP = 44;
        var dots = [];
        var styles = getComputedStyle(document.documentElement);
        var palette = ["--dot", "--accent", "--working", "--waiting"].map(function (name) {
          return styles.getPropertyValue(name).trim();
        });

        function build() {
          var ratio = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * ratio;
          canvas.height = window.innerHeight * ratio;
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          dots = [];
          for (var x = STEP / 2; x < window.innerWidth; x += STEP) {
            for (var y = STEP / 2; y < window.innerHeight; y += STEP) {
              dots.push({ x: x, y: y, tone: 0, lit: 0 });
            }
          }
        }

        function draw() {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          for (var i = 0; i < dots.length; i++) {
            var d = dots[i];
            ctx.globalAlpha = d.lit > 0 ? 0.25 + d.lit * 0.75 : 0.5;
            ctx.fillStyle = palette[d.tone];
            ctx.beginPath();
            ctx.arc(d.x, d.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        function tick() {
          for (var i = 0; i < dots.length; i++) {
            var d = dots[i];
            if (d.lit > 0) {
              d.lit -= 0.006;
              if (d.lit <= 0) {
                d.lit = 0;
                d.tone = 0;
              }
            }
          }
          if (Math.random() < 0.09 && dots.length) {
            var pick = dots[(Math.random() * dots.length) | 0];
            pick.tone = 1 + ((Math.random() * 3) | 0);
            pick.lit = 1;
          }
          draw();
          requestAnimationFrame(tick);
        }

        build();
        window.addEventListener("resize", function () {
          build();
          draw();
        });
        if (reduced) draw();
        else tick();
      })();
    </script>
  </body>
</html>
